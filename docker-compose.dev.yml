services:
  frontend:
    image: node:20-alpine
    container_name: eco-voice-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app           # Source code mount — hot reload shu orqali ishlaydi
      - /app/node_modules         # node_modules ni override qilmaslik uchun
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: eco-voice-api-dev
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ecovoice:ecovoice_password@postgres:5432/ecovoice_analytics}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backend/541.txt:/app/541.txt
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eco-voice-db-dev
    environment:
      POSTGRES_USER: ecovoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecovoice_password}
      POSTGRES_DB: ecovoice_analytics
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ecovoice -d ecovoice_analytics" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data_dev:
